name: Build Windows EXE, macOS DMG and Linux DEB

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            label: windows-exe
          - os: macos-26
            target: mac
            arch: arm64
            label: macos-dmg-apple-silicon
          - os: macos-26-intel
            target: mac
            arch: x64
            label: macos-dmg-intel
          - os: ubuntu-latest
            target: linux
            arch: x64
            label: linux-deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build shared React app for local file URLs
        run: npm run build
      - name: Package desktop app
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installers to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: calculator-${{ matrix.label }}
          path: |
            release-output/*.exe
            release-output/*.dmg
            release-output/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Attach installers to versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/*.exe
            release-output/*.dmg
            release-output/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: false
