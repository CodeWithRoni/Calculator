name: Prepare cross-platform lockfile and validate

on:
  push:
    branches: [cross-platform-release-setup]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cross-platform-release-setup
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate consistent dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lockfile to this feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock cross-platform dependencies"
            git push origin HEAD:cross-platform-release-setup
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Validate native bundle
        run: npm run build
      - name: Validate Pages bundle
        run: npm run build:web
