name: Validate iOS app and optionally export signed IPA

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shared React app
        run: npm run build
      - name: Generate and sync Capacitor iOS app
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Validate iOS simulator build (no signing needed)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Export signed IPA if Apple secrets are configured
        if: env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: bash scripts/sign-ios.sh
      - name: Explain missing signing credentials
        if: env.IOS_CERTIFICATE_BASE64 == '' || env.IOS_CERTIFICATE_PASSWORD == '' || env.IOS_PROVISIONING_PROFILE_BASE64 == '' || env.APPLE_TEAM_ID == ''
        run: echo "::notice::iOS simulator build validated. To export a device-installable IPA, configure an Apple distribution certificate, provisioning profile and Team ID."
      - name: Upload signed IPA
        if: env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: nova-calc-ios-signed-ipa
          path: release-output/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Attach signed IPA to versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != ''
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.ipa
          generate_release_notes: true
