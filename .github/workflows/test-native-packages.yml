name: Validate native installers on setup branch

on:
  push:
    branches: [cross-platform-release-setup]

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx electron-builder --linux deb --x64 --publish never
      - run: ls -lah release-output/*.deb

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: ls -lah android/app/build/outputs/apk/debug/*.apk
